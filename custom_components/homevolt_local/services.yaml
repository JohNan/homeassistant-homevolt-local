delete_schedule:
  name: Delete Schedule
  description: Deletes a specific schedule entry by its ID.
  target:
    device:
      integration: homevolt_local
    entity:
      integration: homevolt_local
  fields:
    schedule_id:
      name: Schedule ID
      description: The ID of the schedule entry to delete.
      required: true
      selector:
        number:
          min: 0
          max: 1000

clear_schedules:
  name: Clear All Schedules
  description: Clears all active schedule entries on the Homevolt battery.
  target:
    device:
      integration: homevolt_local
    entity:
      integration: homevolt_local
